<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Libri letti</title>
  <link rel="stylesheet" href="style.css">
  <script>
    // Se app.js esplode prima di agganciare la UI, almeno lo si vede.
    window.addEventListener("error", function (ev) {
      var el = document.getElementById("status");
      if (!el) return;
      el.hidden = false;
      el.className = "status is-error";
      el.textContent = (ev && ev.message) ? ev.message : "Errore di caricamento";
    });
  </script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#/">Libri letti</a>
    <span class="conteggio" id="conteggio"></span>
    <a class="aggiungi" id="aggiungi" href="#" target="_blank" rel="noopener">Aggiungi</a>
  </header>

  <div class="barra" id="barra">
    <input class="ricerca" id="ricerca" type="search" placeholder="Cerca titolo o autore" autocomplete="off" aria-label="Cerca titolo o autore">
    <select class="anno" id="anno" aria-label="Filtra per anno di lettura">
      <option value="">Tutti gli anni</option>
    </select>
  </div>

  <div id="status" class="status" hidden></div>
  <main id="app" class="app"></main>

  <script src="app.js"></script>
</body>
</html>
