<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cime — diario di gruppo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css">
  <script>
    window.addEventListener("error", function (ev) {
      var el = document.getElementById("status");
      if (!el) return;
      el.hidden = false;
      el.className = "status is-error";
      el.textContent = (ev && ev.message) ? ev.message : "Errore di caricamento";
    });
  </script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#/mappa">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">Cime</span>
    </a>
    <nav class="nav" id="nav">
      <a href="#/mappa" data-nav="mappa">Mappa</a>
      <a href="#/cime" data-nav="cime">Cime</a>
      <a href="#/diario" data-nav="diario">Diario</a>
      <a href="#/alpinisti" data-nav="alpinisti">Alpinisti</a>
      <a href="#/confronta" data-nav="confronta">Confronta</a>
      <a href="#/stats" data-nav="stats">Statistiche</a>
    </nav>
  </header>

  <div id="status" class="status" hidden></div>
  <main id="app" class="app"></main>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="cime.js" charset="utf-8"></script>
  <script src="app.js" charset="utf-8"></script>
</body>
</html>
